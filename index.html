<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d2238"><title>Nour HVAC Manager</title><style>
:root{--nav:#0d2238;--blue:#1167b1;--bg:#f4f6f8;--line:#e5e9ed}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#17212b}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--nav);color:#fff;padding:22px 15px;position:sticky;top:0;height:100vh}.logo{font-size:23px;font-weight:900}.sub{color:#a9bfd4;font-size:12px;margin:3px 0 26px}.nav button{display:block;width:100%;padding:12px;border:0;background:transparent;color:#dbe8f3;text-align:left;border-radius:9px;margin:4px 0;cursor:pointer;font-size:14px}.nav button.active,.nav button:hover{background:#173c5d;color:#fff}.main{flex:1;padding:24px;max-width:1450px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0;font-size:27px}.muted,.label{color:#71808e;font-size:12px}.btn{background:var(--blue);color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.btn.secondary{background:#fff;color:#17212b;border:1px solid #d6dde3}.btn.danger{background:#b42318}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.section{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 5px #0000000d}.value{font-size:25px;font-weight:800;margin-top:7px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:18px}.section h2{font-size:17px;margin:0 0 14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:13px 0;font-size:14px}.tag{font-size:11px;padding:5px 8px;border-radius:20px;background:#e9f2fa;color:#1167b1;white-space:nowrap}.tag.contractor{background:#fff1d8;color:#9a6500}.tag.multi{background:#e8f7ed;color:#26733d}.tag.due{background:#ffe9e7;color:#a4261a}.actions{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}th{color:#71808e;font-size:11px;text-transform:uppercase}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.formgrid.three{grid-template-columns:repeat(3,1fr)}label{font-size:12px;color:#53616e;font-weight:600}input,select,textarea{width:100%;padding:10px;border:1px solid #d6dde3;border-radius:8px;margin:6px 0 12px;background:#fff;font:inherit}textarea{min-height:70px;resize:vertical}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.show{display:flex}.box{background:#fff;border-radius:14px;padding:20px;width:min(760px,100%);max-height:92vh;overflow:auto}.close{float:right;background:none;border:0;font-size:24px;cursor:pointer}.lineitems{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px}.itemrow{display:grid;grid-template-columns:2fr 1fr 1fr 40px;gap:8px;align-items:end}.total{font-size:20px;font-weight:800;text-align:right;padding:10px}.empty{text-align:center;padding:30px;color:#77838e}.notice{background:#eef6ff;border:1px solid #cfe4fb;padding:12px;border-radius:9px;font-size:13px;margin-bottom:15px}.mobilebar{display:none}
@media(max-width:900px){.side{width:205px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.formgrid.three{grid-template-columns:1fr 1fr}}@media(max-width:650px){.side{display:none}.main{padding:15px 15px 80px}.cards{grid-template-columns:1fr 1fr}.formgrid,.formgrid.three{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:4;justify-content:space-around;padding:8px}.mobilebar button{border:0;background:none;font-size:11px}.top h1{font-size:22px}.itemrow{grid-template-columns:1fr 1fr 1fr 35px}}
</style></head><body><div class="app"><aside class="side"><div class="logo">NOUR HVAC</div><div class="sub">Heating & Cooling • LLC</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="label">313-266-9247</div></div><button class="btn" onclick="newCustomer()">+ New Customer</button></div><div id="content"></div></main></div><div class="mobilebar" id="mobilebar"></div><div class="modal" id="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const KEY='nour_hvac_manager_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{customers:[],properties:[],jobs:[],estimates:[],invoices:[],payments:[],seq:1000};
function save(){localStorage.setItem(KEY,JSON.stringify(db))} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function money(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function tag(t){let c=t==='Contractor'?'contractor':t==='Multi-Property'?'multi':t==='Due'?'due':'';return `<span class="tag ${c}">${esc(t)}</span>`}
const pages=['Dashboard','Customers','Properties','Jobs','Estimates','Invoices','Payments'];const icons=['▦','👥','🏠','🔧','📋','🧾','💵'];
function buildNav(){document.getElementById('nav').innerHTML=pages.map((p,i)=>`<button onclick="show('${p}',this)">${icons[i]} ${p}</button>`).join('');document.getElementById('mobilebar').innerHTML=pages.slice(0,5).map((p,i)=>`<button onclick="show('${p}')">${icons[i]}<br>${p}</button>`).join('')}
function show(page,el){document.getElementById('title').textContent=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');let c=document.getElementById('content');if(page==='Dashboard')c.innerHTML=dashboard();if(page==='Customers')c.innerHTML=customersPage();if(page==='Properties')c.innerHTML=propertiesPage();if(page==='Jobs')c.innerHTML=jobsPage();if(page==='Estimates')c.innerHTML=estimatesPage();if(page==='Invoices')c.innerHTML=invoicesPage();if(page==='Payments')c.innerHTML=paymentsPage()}
function dashboard(){let open=db.jobs.filter(x=>x.status!=='Completed').length,pending=db.estimates.filter(x=>x.status==='Pending').length,out=db.invoices.reduce((s,x)=>s+Math.max(0,(x.total||0)-(x.paid||0)),0),month=db.payments.reduce((s,x)=>s+Number(x.amount||0),0);return `<div class="cards"><div class="card"><div class="label">Open Jobs</div><div class="value">${open}</div></div><div class="card"><div class="label">Pending Estimates</div><div class="value">${pending}</div></div><div class="card"><div class="label">Outstanding</div><div class="value">${money(out)}</div></div><div class="card"><div class="label">Payments Recorded</div><div class="value">${money(month)}</div></div></div><div class="grid"><div class="section"><h2>Recent Customers</h2>${db.customers.length?db.customers.slice(-6).reverse().map(c=>`<div class="row"><div><b>${esc(c.name)}</b><div class="label">${esc(c.phone||'')} ${c.address?'• '+esc(c.address):''}</div></div>${tag(c.type)}</div>`).join(''):'<div class="empty">No customers yet. Add your first customer.</div>'}</div><div class="section"><h2>Quick Actions</h2><div class="actions"><button class="btn" onclick="newCustomer()">+ Customer</button><button class="btn" onclick="newEstimate()">+ Estimate</button><button class="btn" onclick="newJob()">+ Job</button><button class="btn" onclick="newInvoice()">+ Invoice</button><button class="btn secondary" onclick="backupData()">💾 Backup</button><button class="btn secondary" onclick="restoreData()">↩ Restore</button></div><div class="notice" style="margin-top:15px">Data is saved locally on this device in your browser.</div></div></div>`}
function customersPage(){return `<div class="section"><div class="top"><h2>Customers</h2><button class="btn" onclick="newCustomer()">+ Add Customer</button></div>${db.customers.length?`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Type</th><th>Phone</th><th>Properties</th><th></th></tr></thead><tbody>${db.customers.map(c=>{let n=db.properties.filter(p=>p.customerId===c.id).length;return `<tr><td><b>${esc(c.name)}</b></td><td>${tag(c.type)}</td><td>${esc(c.phone||'')}</td><td>${n|| (c.type==='Multi-Property'?'Multiple':'1')}</td><td><button class="btn secondary" onclick="editCustomer('${c.id}')">Edit</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No customers yet.</div>'}</div>`}
function propertiesPage(){return `<div class="section"><div class="top"><h2>Properties</h2><button class="btn" onclick="newProperty()">+ Add Property</button></div>${db.properties.length?`<div class="tablewrap"><table><thead><tr><th>Property</th><th>Customer</th><th>City</th><th></th></tr></thead><tbody>${db.properties.map(p=>`<tr><td>${esc(p.address)}</td><td>${esc((db.customers.find(c=>c.id===p.customerId)||{}).name||'')}</td><td>${esc(p.city||'')}</td><td><button class="btn secondary" onclick="newJob('${p.id}')">+ Job</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Add properties for customers with multiple homes.</div>'}</div>`}
function jobsPage(){return `<div class="section"><div class="top"><h2>Jobs</h2><button class="btn" onclick="newJob()">+ Add Job</button></div>${db.jobs.length?`<div class="tablewrap"><table><thead><tr><th>Job</th><th>Customer</th><th>Address</th><th>Status</th><th></th></tr></thead><tbody>${db.jobs.map(j=>`<tr><td><b>${esc(j.title)}</b></td><td>${esc((db.customers.find(c=>c.id===j.customerId)||{}).name||'')}</td><td>${esc(j.address||'')}</td><td>${tag(j.status)}</td><td><button class="btn secondary" onclick="editJob('${j.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No jobs yet.</div>'}</div>`}
function estimatesPage(){return `<div class="section"><div class="top"><h2>Estimates</h2><button class="btn" onclick="newEstimate()">+ New Estimate</button></div>${db.estimates.length?`<div class="tablewrap"><table><thead><tr><th>#</th><th>Customer</th><th>Offer</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${db.estimates.map(e=>`<tr><td>#${e.number}</td><td>${esc((db.customers.find(c=>c.id===e.customerId)||{}).name||'')}</td><td>${esc(e.offerName||'Offer 1')}</td><td><b>${money(e.total)}</b></td><td>${tag(e.status)}</td><td><button class="btn secondary" onclick="printEstimate('${e.id}')">Print / PDF</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No estimates yet.</div>'}</div>`}
function invoicesPage(){return `<div class="section"><div class="top"><h2>Invoices</h2><button class="btn" onclick="newInvoice()">+ New Invoice</button></div>${db.invoices.length?`<div class="tablewrap"><table><thead><tr><th>#</th><th>Customer</th><th>Total</th><th>Paid</th><th>Balance</th><th></th></tr></thead><tbody>${db.invoices.map(i=>`<tr><td>#${i.number}</td><td>${esc((db.customers.find(c=>c.id===i.customerId)||{}).name||'')}</td><td>${money(i.total)}</td><td>${money(i.paid)}</td><td>${tag((i.total-i.paid)>0?'Due':'Paid')} ${money(Math.max(0,i.total-i.paid))}</td><td><button class="btn secondary" onclick="printInvoice('${i.id}')">Print / PDF</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No invoices yet.</div>'}</div>`}
function paymentsPage(){return `<div class="section"><div class="top"><h2>Payments</h2><button class="btn" onclick="newPayment()">+ Record Payment</button></div>${db.payments.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Invoice</th><th>Amount</th></tr></thead><tbody>${db.payments.slice().reverse().map(p=>`<tr><td>${esc(p.date)}</td><td>${esc((db.customers.find(c=>c.id===p.customerId)||{}).name||'')}</td><td>#${esc(p.invoiceNumber||'')}</td><td><b>${money(p.amount)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No payments recorded yet.</div>'}</div>`}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function customerOptions(sel=''){return db.customers.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)} — ${esc(c.type)}</option>`).join('')}
function newCustomer(c=null){openModal(`<h2>${c?'Edit':'New'} Customer</h2><div class="formgrid"><div><label>Name</label><input id="f_name" value="${esc(c?.name||'')}"></div><div><label>Phone</label><input id="f_phone" value="${esc(c?.phone||'')}"></div></div><label>Customer Type</label><select id="f_type"><option ${c?.type==='Residential'?'selected':''}>Residential</option><option ${c?.type==='Contractor'?'selected':''}>Contractor</option><option ${c?.type==='Multi-Property'?'selected':''}>Multi-Property</option></select><label>Primary Address</label><input id="f_address" value="${esc(c?.address||'')}"><label>Notes</label><textarea id="f_notes">${esc(c?.notes||'')}</textarea><button class="btn" onclick="saveCustomer('${c?.id||''}')">Save Customer</button>`)}
function saveCustomer(id){let x={id:id||crypto.randomUUID(),name:document.getElementById('f_name').value.trim(),phone:document.getElementById('f_phone').value.trim(),type:document.getElementById('f_type').value,address:document.getElementById('f_address').value.trim(),notes:document.getElementById('f_notes').value};if(!x.name)return alert('Enter customer name');if(id){let i=db.customers.findIndex(c=>c.id===id);db.customers[i]=x}else db.customers.push(x);save();closeModal();show('Customers',document.querySelectorAll('.nav button')[1])}
function editCustomer(id){newCustomer(db.customers.find(c=>c.id===id))}
function newProperty(){if(!db.customers.length)return alert('Add a customer first');openModal(`<h2>New Property</h2><label>Customer</label><select id="p_customer">${customerOptions()}</select><label>Address</label><input id="p_address" placeholder="Street address"><div class="formgrid"><div><label>City</label><input id="p_city"></div><div><label>State</label><input id="p_state" value="MI"></div></div><button class="btn" onclick="saveProperty()">Save Property</button>`)}
function saveProperty(){let x={id:crypto.randomUUID(),customerId:document.getElementById('p_customer').value,address:document.getElementById('p_address').value,city:document.getElementById('p_city').value,state:document.getElementById('p_state').value};if(!x.address)return alert('Enter address');db.properties.push(x);save();closeModal();show('Properties')}
function newJob(propertyId=''){if(!db.customers.length)return alert('Add a customer first');openModal(`<h2>New Job</h2><div class="formgrid"><div><label>Customer</label><select id="j_customer">${customerOptions()}</select></div><div><label>Status</label><select id="j_status"><option>Quote</option><option>Scheduled</option><option>In Progress</option><option>Completed</option></select></div></div><label>Job Title</label><input id="j_title" placeholder="AC replacement / Furnace install"><label>Address</label><input id="j_address" value="${esc(db.properties.find(p=>p.id===propertyId)?.address||'')}"><label>Notes</label><textarea id="j_notes"></textarea><button class="btn" onclick="saveJob()">Save Job</button>`)}
function saveJob(){let x={id:crypto.randomUUID(),customerId:document.getElementById('j_customer').value,status:document.getElementById('j_status').value,title:document.getElementById('j_title').value||'HVAC Job',address:document.getElementById('j_address').value,notes:document.getElementById('j_notes').value};db.jobs.push(x);save();closeModal();show('Jobs')}
function editJob(id){let j=db.jobs.find(x=>x.id===id);openModal(`<h2>Edit Job</h2><label>Status</label><select id="ej_status">${['Quote','Scheduled','In Progress','Completed'].map(s=>`<option ${j.status===s?'selected':''}>${s}</option>`).join('')}</select><label>Notes</label><textarea id="ej_notes">${esc(j.notes||'')}</textarea><button class="btn" onclick="updateJob('${id}')">Save</button>`)}function updateJob(id){let j=db.jobs.find(x=>x.id===id);j.status=document.getElementById('ej_status').value;j.notes=document.getElementById('ej_notes').value;save();closeModal();show('Jobs')}
function newEstimate(){if(!db.customers.length)return alert('Add a customer first');openModal(`<h2>New HVAC Estimate</h2><div class="formgrid"><div><label>Customer</label><select id="e_customer">${customerOptions()}</select></div><div><label>Offer Name</label><input id="e_offer" value="Offer 1"></div></div><label>Property / Job Address</label><input id="e_address"><div class="lineitems" id="items"><div class="itemrow"><div><label>Item / Scope</label><input class="it" placeholder="Furnace 80k BTU 96% Goodman"></div><div><label>Qty</label><input class="qty" type="number" value="1"></div><div><label>Price</label><input class="pr" type="number" value="0"></div><button class="btn danger" onclick="this.parentElement.remove();calcTotal()">×</button></div></div><button class="btn secondary" onclick="addItem()">+ Add Item</button><div class="total">Total: <span id="etotal">$0.00</span></div><div class="formgrid"><div><label>Material Warranty</label><input id="e_mw" value="10 years"></div><div><label>Labor Warranty</label><input id="e_lw" value="1 year"></div></div><label>Notes</label><textarea id="e_notes" placeholder="Ductwork, gas line, electrical, vents, exclusions..."></textarea><button class="btn" onclick="saveEstimate()">Save Estimate</button>`);document.getElementById('items').addEventListener('input',calcTotal)}
function addItem(){let d=document.createElement('div');d.className='itemrow';d.innerHTML='<div><input class="it" placeholder="Coil / AC / Ductwork"></div><div><input class="qty" type="number" value="1"></div><div><input class="pr" type="number" value="0"></div><button class="btn danger" onclick="this.parentElement.remove();calcTotal()">×</button>';document.getElementById('items').appendChild(d)}function calcTotal(){let t=0;document.querySelectorAll('#items .itemrow').forEach(r=>t+=(Number(r.querySelector('.qty').value)||0)*(Number(r.querySelector('.pr').value)||0));let e=document.getElementById('etotal');if(e)e.textContent=money(t);return t}
function saveEstimate(){let items=[...document.querySelectorAll('#items .itemrow')].map(r=>({name:r.querySelector('.it').value,qty:Number(r.querySelector('.qty').value)||1,price:Number(r.querySelector('.pr').value)||0})).filter(x=>x.name);let e={id:crypto.randomUUID(),number:++db.seq,customerId:document.getElementById('e_customer').value,offerName:document.getElementById('e_offer').value||'Offer 1',address:document.getElementById('e_address').value,items,total:items.reduce((s,x)=>s+x.qty*x.price,0),mw:document.getElementById('e_mw').value,lw:document.getElementById('e_lw').value,notes:document.getElementById('e_notes').value,status:'Pending'};db.estimates.push(e);save();closeModal();show('Estimates')}
function newInvoice(){if(!db.customers.length)return alert('Add a customer first');openModal(`<h2>New Invoice</h2><div class="formgrid"><div><label>Customer</label><select id="i_customer">${customerOptions()}</select></div><div><label>Total</label><input id="i_total" type="number" value="0"></div></div><label>Description</label><textarea id="i_desc" placeholder="HVAC installation / repair"></textarea><button class="btn" onclick="saveInvoice()">Save Invoice</button>`)}function saveInvoice(){let i={id:crypto.randomUUID(),number:++db.seq,customerId:document.getElementById('i_customer').value,total:Number(document.getElementById('i_total').value)||0,paid:0,description:document.getElementById('i_desc').value};db.invoices.push(i);save();closeModal();show('Invoices')}
function newPayment(){if(!db.invoices.length)return alert('Create an invoice first');openModal(`<h2>Record Payment</h2><label>Invoice</label><select id="pay_inv">${db.invoices.map(i=>`<option value="${i.id}">#${i.number} — ${money(i.total-i.paid)} due</option>`).join('')}</select><label>Amount</label><input id="pay_amt" type="number" step="0.01"><button class="btn" onclick="savePayment()">Save Payment</button>`)}function savePayment(){let i=db.invoices.find(x=>x.id===document.getElementById('pay_inv').value),a=Number(document.getElementById('pay_amt').value)||0;if(!i||a<=0)return alert('Enter a valid payment');i.paid+=a;let c=i.customerId;db.payments.push({id:crypto.randomUUID(),date:new Date().toLocaleDateString(),customerId:c,invoiceNumber:i.number,amount:a});save();closeModal();show('Payments')}
function printEstimate(id){let e=db.estimates.find(x=>x.id===id),c=db.customers.find(x=>x.id===e.customerId)||{};printDoc('ESTIMATE #'+e.number,c,e.items,e.total,e.address,e.mw,e.lw,e.notes,e.offerName)}function printInvoice(id){let i=db.invoices.find(x=>x.id===id),c=db.customers.find(x=>x.id===i.customerId)||{};printDoc('INVOICE #'+i.number,c,[{name:i.description||'HVAC Service',qty:1,price:i.total}],i.total,c.address||'', '', '', 'Paid: '+money(i.paid)+' • Balance: '+money(i.total-i.paid),'')}
function printDoc(title,c,items,total,address,mw,lw,notes,offer){let w=window.open('','_blank');w.document.write(`<html><head><title>${title}</title><style>body{font-family:Arial;padding:40px;color:#17212b}h1{color:#0d2238}table{width:100%;border-collapse:collapse;margin-top:25px}th,td{border-bottom:1px solid #ddd;padding:10px;text-align:left}.right{text-align:right}.total{font-size:22px;font-weight:bold;text-align:right;margin-top:20px}.box{padding:15px;background:#f4f6f8;margin-top:20px}@media print{button{display:none}}</style></head><body><h1>NOUR HVAC</h1><div>Heating & Cooling • 313-266-9247</div><h2>${title}</h2><p><b>Customer:</b> ${esc(c.name||'')}<br><b>Phone:</b> ${esc(c.phone||'')}<br><b>Address:</b> ${esc(address||c.address||'')}</p>${offer?'<p><b>'+esc(offer)+'</b></p>':''}<table><tr><th>Item / Scope</th><th>Qty</th><th>Price</th><th>Total</th></tr>${items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td></tr>`).join('')}</table><div class="total">Total: ${money(total)}</div><div class="box"><b>Warranty</b><br>Material: ${esc(mw||'')}<br>Labor: ${esc(lw||'')}<br><br>${esc(notes||'')}</div><p>Thank you for choosing Nour HVAC.</p><button onclick="window.print()">Print / Save as PDF</button></body></html>`);w.document.close();w.focus()}
function backupData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nour-hvac-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.customers)||!Array.isArray(x.invoices))throw Error();db=x;save();show('Dashboard',document.querySelector('.nav button'));alert('Backup restored successfully.')}catch(e){alert('Invalid backup file.')}};r.readAsText(f)};input.click()}
buildNav();show('Dashboard',document.querySelector('.nav button'));save();
</script></body></html>
